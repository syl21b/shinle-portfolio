<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page App redirect for GitHub Pages
    const segmentCount = 1; // Adjust if your base path is different
    const l = window.location;
    const base = '/shinle-portfolio/';
    
    // If we're not at the index.html, redirect to it
    if (!l.pathname.includes('index.html')) {
      const path = l.pathname.substring(base.length);
      window.location.replace(base + 'index.html' + l.search + l.hash);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
