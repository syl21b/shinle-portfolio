    <!-- Add this script -->
    <script>
      // Handle hash-based routing for GitHub Pages
      (function() {
        if (window.location.hash && window.location.hash.startsWith('#!')) {
          const path = window.location.hash.substring(2);
          window.history.replaceState(null, null, path);
        }
      })();
    </script>
